name: fresh-source-launcher-contract
on:
  pull_request:
    paths:
      - "scripts/START_FRESH_SOURCE_REPLICATION.R"
      - "scripts/test_fresh_source_launcher.R"
      - ".github/workflows/fresh-launcher.yml"
  workflow_dispatch:
jobs:
  isolated-launcher:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
      - name: Install only launcher test dependencies
        run: Rscript -e "install.packages(c('jsonlite','digest'), repos='https://cloud.r-project.org')"
      - name: Test isolation, input identity, resume and numerical comparison
        run: Rscript scripts/test_fresh_source_launcher.R
