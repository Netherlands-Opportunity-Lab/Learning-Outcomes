name: public-dashboard-checks

on:
  pull_request:
    paths:
      - "03_dashboard/**"
      - "05_publication/**"
      - "README.md"
      - "DATA_LICENSE.md"
      - "KNOWN_LIMITATIONS.md"
      - "CHANGELOG.md"
      - ".github/workflows/public-dashboard-checks.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interim-dashboard:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check final and interim publication boundaries
        run: |
          python -m unittest discover -s 06_pipeline/tests -p 'test_*guided*.py' -v
          python -m unittest discover -s 06_pipeline/tests -p 'test_partial_dashboard_release.py' -v
          node --check 05_publication/preview_overlay/assets/app-shell.js
          node 05_publication/tests/test_explorer.mjs
      - name: Reconstruct actual public figures from the downloadable package
        run: python 05_publication/tests/verify_interim_candidate.py
  public-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Restored October dashboard and numeric rendering
        run: node 05_publication/tests/test_restored_renderer.cjs
      - name: Five-choice explorer and exact reference/rank calculations
        run: node 05_publication/tests/test_explorer.mjs
      - name: JavaScript syntax
        run: node --check 03_dashboard/app/assets/app-product.js
      - name: Build public-safe site
        run: python 05_publication/build_public_pages.py
      - name: Existing public-site validator
        run: python 05_publication/validate_public_site.py
      - name: Final public integration checks
        run: python 05_publication/tests/validate_public_integration.py

