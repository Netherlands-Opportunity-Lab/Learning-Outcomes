name: storage-and-replication-contract
on:
  pull_request:
    paths:
      - "06_pipeline/**"
      - ".github/workflows/storage-lifecycle-ci.yml"
  workflow_dispatch:
jobs:
  storage-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test content-addressed store and safety gates
        run: python -m unittest discover -s 06_pipeline/tests -v
  r-entrypoint-parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Parse R production launcher without starting any production
        run: Rscript -e "parse(file='06_pipeline/RUN.R'); cat('R launcher parses OK\n')"
