name: storage-and-replication-contract
on:
  pull_request:
    paths:
      - "06_pipeline/**"
      - ".github/workflows/storage-lifecycle-ci.yml"
  workflow_dispatch:
jobs:
  storage-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test local storage and private Drive sync (no credentials)
        run: python -m unittest discover -s 06_pipeline/tests -v
  r-entrypoint-parse:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Install minimal R JSON dependency
        run: Rscript -e "install.packages(c('jsonlite','digest','zip','DBI','RSQLite'), repos='https://cloud.r-project.org')"
      - name: Parse R production launcher without starting any production
        run: Rscript -e "parse(file='START.R'); parse(file='06_pipeline/RUN.R'); parse(file='06_pipeline/DRIVE_SYNC.R'); parse(file='06_pipeline/GITHUB_STATUS.R'); parse(file='06_pipeline/BUNDLE_DISCOVERY.R'); parse(file='06_pipeline/PRODUCT_SCOPE_GATE.R'); parse(file='06_pipeline/REFERENCE_SOURCE_AUDIT.R'); parse(file='06_pipeline/MASTER_STORAGE.R'); parse(file='06_pipeline/LOCAL_CLEANUP_GATE.R'); parse(file='06_pipeline/LOCAL_QUARANTINE.R'); parse(file='06_pipeline/PROVENANCE_AUDIT.R'); parse(file='06_pipeline/CANONICAL_RESULT_RECONCILIATION.R'); parse(file='06_pipeline/CONTRACT_REUSE_QUEUE.R'); parse(file='06_pipeline/REUSE_PREFLIGHT.R'); parse(file='06_pipeline/EXISTING_LO02_EXPORT.R'); parse(file='06_pipeline/MINIMUM_FIGURE_QUEUE.R'); parse(file='06_pipeline/MASTER_ESTIMATION_GRID.R'); parse(file='06_pipeline/GRID_ARCHIVE_BATCH.R'); parse(file='06_pipeline/LO_SCOPE_LOCK.R'); parse(file='06_pipeline/LO_EXISTING_RESULT_REGISTRY.R'); parse(file='06_pipeline/LO_FIXED_VALIDATION.R'); parse(file='06_pipeline/LO_FIXED_PRODUCERS.R'); parse(file='06_pipeline/LO_FIXED_CLEANUP_GATES.R'); parse(file='06_pipeline/LO_FIXED_CONTROLLER.R'); parse(file='06_pipeline/LO_FIXED_COMPARATOR.R'); parse(file='06_pipeline/LO_FINAL_DASHBOARD_EXPORT.R'); parse(file='06_pipeline/V5_NLD_CORE_ONLY.R'); parse(file='06_pipeline/RESULT_LINEAGE_RECORDS.R'); parse(file='06_pipeline/RECONCILE_AND_PLAN.R'); cat('R launcher and native Drive sync parse OK\n')"
      - name: Validate the fixed 19-country reference membership contract
        run: Rscript 06_pipeline/tests/test_run.R
      - name: Test R-native private Drive reports and reviewed return ZIP
        run: Rscript 06_pipeline/tests/test_drive_sync_r.R
      - name: Test exact-run LO02 read-only export, without pupil data
        run: Rscript 06_pipeline/tests/test_existing_lo02_export.R
      - name: Test product-driven minimum computations with synthetic contracts
        run: Rscript 06_pipeline/tests/test_minimum_figure_queue.R
      - name: Test blank-first scientific estimation grid and strict archive fill
        run: Rscript 06_pipeline/tests/test_master_estimation_grid.R
      - name: Test strict archive grid fill and shared-wave batch scheduling
        run: Rscript 06_pipeline/tests/test_grid_archive_batch.R
      - name: Test fixed 1/20/50 production scopes, QA gates and dashboard mapping
        run: Rscript 06_pipeline/tests/test_fixed_pipeline.R
      - name: Test frozen equal-weight reference panel and no benchmark SE
        run: Rscript 06_pipeline/tests/test_fixed_comparator.R
      - name: Test locked archive and SQLite evidence extraction without fabricated N
        run: Rscript 06_pipeline/tests/test_fixed_existing_result_registry.R
      - name: Test public Git status privacy filter without network push
        run: Rscript 06_pipeline/tests/test_github_status.R
      - name: Test figure, slide, paper and country-scope mapping invariants
        run: Rscript 06_pipeline/tests/test_product_gate.R
      - name: Test 89GB inventory/retirement gates with synthetic files
        run: Rscript 06_pipeline/tests/test_master_storage.R
      - name: Test gated same-volume quarantine and restore with synthetic files
        run: Rscript 06_pipeline/tests/test_local_quarantine.R
      - name: Test reuse preflight with no approval and locked execution
        run: Rscript 06_pipeline/tests/test_reuse_preflight.R
      - name: Test archive-first contract reuse and conflict semantics
        run: Rscript 06_pipeline/tests/test_contract_reuse_queue.R
      - name: Test NLD-only native V5 path with candidate suppression
        run: Rscript 06_pipeline/tests/test_v5_nld_core.R
