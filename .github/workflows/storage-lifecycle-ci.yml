name: storage-and-replication-contract
on:
  pull_request:
    paths:
      - "06_pipeline/**"
      - ".github/workflows/storage-lifecycle-ci.yml"
  workflow_dispatch:
jobs:
  storage-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test local storage and private Drive sync (no credentials)
        run: python -m unittest discover -s 06_pipeline/tests -v
  r-entrypoint-parse:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Install minimal R JSON dependency
        run: Rscript -e "install.packages('jsonlite', repos='https://cloud.r-project.org')"
      - name: Parse R production launcher without starting any production
        run: Rscript -e "parse(file='06_pipeline/RUN.R'); parse(file='06_pipeline/DRIVE_SYNC.R'); parse(file='06_pipeline/GITHUB_STATUS.R'); cat('R launcher and native Drive sync parse OK\n')"
      - name: Validate the fixed 19-country reference membership contract
        run: Rscript 06_pipeline/tests/test_run.R
      - name: Test public Git status privacy filter without network push
        run: Rscript 06_pipeline/tests/test_github_status.R
