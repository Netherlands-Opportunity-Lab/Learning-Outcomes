name: sanitize-public-runtime-once

on:
  push:
    branches: [public-dashboard-final-20260928]
    paths:
      - ".github/workflows/sanitize-public-runtime.yml"

permissions:
  contents: write

jobs:
  sanitize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: public-dashboard-final-20260928
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Remove non-runtime control tables and scan public bytes
        run: python 05_publication/tests/sanitize_public_runtime.py
      - name: Commit sanitized runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 05_publication/public_dashboard_runtime_20260928.zip 05_publication/PUBLIC_RUNTIME_SANITIZE_RECEIPT.json
          git commit -m "Sanitize minimal public dashboard runtime"
          git push origin HEAD:public-dashboard-final-20260928
