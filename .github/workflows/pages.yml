name: publish-verified-dashboard-pages
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: 'Verified candidate ID (20 lowercase hexadecimal characters)'
        required: true
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify and prepare the exact scientific candidate
        env:
          DASHBOARD_CANDIDATE: ${{ inputs.candidate }}
        run: python 05_publication/prepare_verified_pages.py
      - name: Check the actual explorer and rank/reference engine
        run: |
          node --check public_site_dist/assets/app-shell.js
          node 05_publication/tests/test_explorer.mjs public_site_dist/data/figure_registry.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public_site_dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified dashboard
        id: deployment
        uses: actions/deploy-pages@v4
