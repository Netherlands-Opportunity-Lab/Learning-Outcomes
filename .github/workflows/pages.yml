# final-public-release-trigger: 2026-09-28T21:24+02:00
name: publish-dashboard-pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      confirm_public_deploy:
        description: "Deploy the validated public dashboard from main"
        required: true
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  detect-runtime:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.confirm_public_deploy == true)
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.runtime.outputs.present }}
    steps:
      - uses: actions/checkout@v4
      - id: runtime
        shell: bash
        run: |
          if [ -f 05_publication/public_dashboard_runtime_20260928.zip ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Controlled public runtime ZIP is missing."
          fi

  build:
    needs: detect-runtime
    if: needs.detect-runtime.outputs.present == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: JavaScript syntax
        run: node --check 03_dashboard/app/assets/app-product.js
      - name: Build public-safe static site
        run: python 05_publication/build_public_pages.py
      - name: Validate public site
        run: python 05_publication/validate_public_site.py
      - name: Validate final public integration
        run: python 05_publication/tests/validate_public_integration.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public_site_dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  online-qa:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ needs.deploy.outputs.page_url }}
      ONLINE_QA_DIR: online_qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser automation library
        run: npm install --no-save playwright-core@1.55.0
      - name: Real-browser and online-fidelity QA
        id: online
        continue-on-error: true
        run: node 05_publication/tests/online_publication_qa.mjs
      - name: Generate final release reports
        id: reports
        run: |
          python 05_publication/tests/finalize_online_reports.py \
            --site-url "$SITE_URL" \
            --git-sha "$GITHUB_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --qa-json online_qa/online_qa.json \
            --files-json online_qa/online_files.json \
            --output-dir online_qa
      - name: Upload final release reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-public-dashboard-release
          path: online_qa/
          if-no-files-found: warn
      - name: Enforce browser QA result
        if: steps.online.outcome != 'success'
        run: exit 1
