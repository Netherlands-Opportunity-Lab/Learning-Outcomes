name: publish-dashboard-pages-working-preview

on:
  push:
    branches: [main]
    paths:
      - "05_publication/preview_chunks/**"
      - "05_publication/preview_overlay/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconstruct current working dashboard preview
        shell: bash
        run: |
          cat 05_publication/preview_chunks/part*.b64 > /tmp/current_dashboard_preview.b64
          base64 -d /tmp/current_dashboard_preview.b64 > /tmp/current_dashboard_preview.tar.gz
          echo "08d6343903d4e5263a9ea2edc178cc8b63225f92f66e33bfaeb7365200498629  /tmp/current_dashboard_preview.tar.gz" | sha256sum -c -
          rm -rf public_site_dist
          mkdir -p public_site_dist
          tar -xzf /tmp/current_dashboard_preview.tar.gz -C public_site_dist

      - name: Apply chart-first guided landing overlay
        shell: bash
        run: |
          cp 05_publication/preview_overlay/assets/app-shell.js public_site_dist/assets/app-shell.js
          cp 05_publication/preview_overlay/assets/styles.css public_site_dist/assets/styles.css
          cp 05_publication/preview_overlay/locales/nl.json public_site_dist/locales/nl.json
          cp 05_publication/preview_overlay/locales/en.json public_site_dist/locales/en.json

      - name: Rebuild locale homes and common-42 deep links from one template
        shell: python
        run: |
          import json, pathlib
          root = pathlib.Path("public_site_dist")
          template = pathlib.Path("05_publication/preview_overlay/index.html").read_text(encoding="utf-8")
          countries = json.loads((root/"data/common42.json").read_text(encoding="utf-8"))
          codes = [x["code"] for x in countries]
          assert len(codes) == 42 and len(set(codes)) == 42 and codes.count("NLD") == 1
          questions = ["trends","distribution","gaps","environment"]
          def write(parts):
              dest=root.joinpath(*parts); dest.mkdir(parents=True,exist_ok=True)
              base="../"*len(parts)
              (dest/"index.html").write_text(template.replace("__BASE__",base),encoding="utf-8")
          for locale in ["nl","en"]:
              write([locale])
              for code in codes:
                  for question in questions:
                      write([locale,"country",code,question])
          (root/"index.html").write_text('<!doctype html><meta charset="utf-8"><title>International Learning Outcomes Explorer</title><meta http-equiv="refresh" content="0; url=nl/"><p><a href="nl/">Nederlands</a> · <a href="en/">English</a></p>',encoding="utf-8")
          (root/"404.html").write_text('<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Not found · International Learning Outcomes Explorer</title><style>body{font-family:Aptos,"Segoe UI",Arial,sans-serif;background:#F7F5F0;color:#17242D;padding:3rem;line-height:1.5}a{color:#315D8A}</style></head><body><h1>Deze route bestaat niet / This route does not exist</h1><p><a href="./nl/">Nederlands</a> · <a href="./en/">English</a></p></body></html>',encoding="utf-8")

      - name: Preview integrity checks
        shell: bash
        run: |
          node --check public_site_dist/assets/app-shell.js
          test -f public_site_dist/nl/index.html
          test -f public_site_dist/en/index.html
          test -f public_site_dist/nl/country/NLD/trends/index.html
          test -f public_site_dist/data/countries/NLD.json
          test -f public_site_dist/data/availability/NLD.json
          grep -q "International Learning Outcomes Explorer" public_site_dist/nl/index.html
          grep -q "question-strip" public_site_dist/nl/index.html
          grep -q "guided-builder" public_site_dist/nl/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public_site_dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy current working dashboard
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: HTTP smoke test
        shell: python
        run: |
          import os, urllib.request, time
          base = os.environ["SITE_URL"].rstrip("/") + "/"
          urls = [base,base+"nl/",base+"en/",base+"nl/country/NLD/trends/",base+"assets/app-shell.js",base+"data/countries/NLD.json"]
          for attempt in range(6):
              try:
                  for url in urls:
                      with urllib.request.urlopen(url, timeout=20) as r:
                          body=r.read(); assert r.status==200,(url,r.status); assert body,url
                  print("Online dashboard HTTP smoke test passed:",base); break
              except Exception:
                  if attempt==5: raise
                  time.sleep(10)
      - name: Install browser automation library
        run: npm install --no-save playwright-core@1.55.0
      - name: Guided landing browser smoke
        shell: node {0}
        run: |
          const { chromium } = require(require.resolve('playwright-core',{paths:[process.cwd()]}));
          (async()=>{
            const base = process.env.SITE_URL.replace(/\/$/,'') + '/';
            const browser = await chromium.launch({headless:true, executablePath:'/usr/bin/google-chrome'});
            const page = await browser.newPage({viewport:{width:1440,height:1000}});
            const errors=[],badResponses=[]; page.on('console',m=>{if(m.type()==='error')errors.push(m.text())}); page.on('pageerror',e=>errors.push(String(e))); page.on('response',r=>{if(r.status()>=400)badResponses.push(r.status()+' '+r.url())});
            await page.goto(base+'nl/',{waitUntil:'networkidle'});
            if(await page.locator('svg.time-chart').count()!==1) throw new Error('Landing chart missing');
            if(await page.locator('#questionGrid .question-choice').count()!==4) throw new Error('Question guide missing');
            if(!((await page.locator('#figureContext').innerText()).includes('Nederland'))) throw new Error('Landing context missing');
            const axisAudit=await page.evaluate(()=>{const s=window.__learningOutcomesShell.state,svg=document.querySelector('svg.time-chart'),rows=s.records.filter(r=>r.figure_id===s.currentFigure.figure_id&&Number.isFinite(+r.estimate)),vals=rows.map(r=>+r.estimate);return {yMin:+svg.dataset.yMin,yMax:+svg.dataset.yMax,policy:svg.dataset.axisPolicy,min:Math.min(...vals),max:Math.max(...vals)};});
            if(!(axisAudit.yMin<axisAudit.min&&axisAudit.yMax>axisAudit.max)) throw new Error('Tight y-axis does not bracket visible points: '+JSON.stringify(axisAudit));
            if(axisAudit.policy!=='dynamic') throw new Error('Landing time-series axis should be dynamic: '+JSON.stringify(axisAudit));
            if(await page.locator('#outcomeSelect option[value="below_basic"]').count()){
              await page.locator('#outcomeSelect').selectOption('below_basic'); await page.waitForTimeout(100);
              const pctAxis=await page.locator('svg.time-chart').evaluate(svg=>({min:+svg.dataset.yMin,max:+svg.dataset.yMax,policy:svg.dataset.axisPolicy}));
              if(pctAxis.policy!=='dynamic'||(pctAxis.min===0&&pctAxis.max===100)) throw new Error('Ordinary percentage time series should use a tight dynamic axis: '+JSON.stringify(pctAxis));
            }
            await page.locator('[data-question="distribution"]').click();
            await page.waitForTimeout(150);
            if(!page.url().includes('/nl/country/NLD/distribution/')) throw new Error('Question route not updated');
            await page.locator('[data-question="gaps"]').click(); await page.waitForTimeout(100);
            if(!(await page.locator('#splitGroup').isVisible())) throw new Error('Progressive gap controls missing');
            await page.locator('[data-question="environment"]').click(); await page.waitForTimeout(100);
            if(!(await page.locator('#peerGroup').isVisible())) throw new Error('Progressive peer controls missing');
            const mobile = await browser.newPage({viewport:{width:390,height:844}}); await mobile.goto(base+'nl/',{waitUntil:'networkidle'});
            const overflow=await mobile.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth); if(overflow) throw new Error('Mobile horizontal overflow');
            const substantiveErrors=errors.filter(e=>!/^Failed to load resource: the server responded with a status of 404/.test(e)); if(substantiveErrors.length||badResponses.length) throw new Error('Console errors: '+substantiveErrors.join(' | ')+' ; bad responses: '+badResponses.join(' | '));
            console.log('Guided landing browser smoke passed:', base);
            await browser.close();
          })().catch(err=>{console.error(err);process.exit(1)});
