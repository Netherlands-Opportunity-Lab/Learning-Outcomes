name: public-product-reconstruction
on:
  pull_request:
    paths:
      - "05_publication/**"
      - "replication/**"
      - "04_results/review/all_required/**"
      - ".github/workflows/research-products.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Reject private document and nested archive regressions
        run: python -m unittest discover -s 05_publication/tests -p test_public_distribution.py -v
      - name: Check all actual public selection contracts
        run: python 05_publication/tests/check_current_public.py
      - name: Reconstruct downloadable dashboard and inspect sealed results
        run: python 05_publication/tests/verify_interim_candidate.py
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-proof-${{ matrix.os }}
          path: dashboard-selection-proof.json
