name: research-product-reconstruction
on:
  pull_request:
    paths:
      - "04_products_or_release/current47/**"
      - "04_results/review/all_required/**"
      - "06_pipeline/review_20261013/scientific_review/SCIENTIFIC_REVIEW_MANIFEST.json"
      - ".github/workflows/research-products.yml"
      - "05_publication/tests/verify_current47_selections.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 04_products_or_release/current47/requirements.txt
      - name: Install recorded product libraries
        run: python -m pip install -r 04_products_or_release/current47/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check paper anchors and written-claim regression cases
        run: python 04_products_or_release/current47/scripts/test_product_contracts.py
      - name: Check all actual dashboard selection contracts
        run: node 05_publication/tests/verify_current47_selections.mjs . 05_publication/verified_guided_candidates/ce55760e9df4f4b4428e dashboard-selection-proof.json
      - name: Rebuild the paper and native-chart presentation from sealed aggregates
        run: python 04_products_or_release/current47/REBUILD_PRODUCTS.py --output rebuilt_products
      - uses: actions/upload-artifact@v4
        with:
          name: product-proof-${{ matrix.os }}
          path: |
            dashboard-selection-proof.json
            rebuilt_products/PRODUCT_VALUES_AND_CLAIMS_REVIEW.json
            rebuilt_products/deck/final/*.rebuild.json
            rebuilt_products/paper/PAPER_PRODUCT_TRACE.json
